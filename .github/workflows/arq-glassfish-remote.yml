name: arq-glassfish-remote

on:
  push:
    paths-ignore:
      - "docs/**"
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      glassfish:
        image: ghcr.io/eclipse-ee4j/glassfish:8.0.4
        ports:
          - 4848:4848
          - 8080:8080
        # Trailing command arguments to initialize custom/init.asadmin safely
        command: >-
          /bin/bash -c "mkdir -p custom && echo 'start-database' > custom/init.asadmin && exec /usr/local/bin/docker-entrypoint.sh startserv"
        env:
          AS_ADMIN_PASSWORD: adminadmin
        options: >-
          --health-cmd "curl -fk https://localhost:4848/ || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 60s
          --entrypoint ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean verify -Parq-glassfish-remote

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: glassfish-remote-logs
          path: |
            **/logs/
            target/**/*.log
